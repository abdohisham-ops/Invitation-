<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdulrahman &amp; Nadine | Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#fffdf8,#f7e8df 70%,#efd6c9);color:#713c2c;font-family:'Cormorant Garamond',serif}
.card{position:relative;overflow:hidden;width:min(100%,560px);min-height:700px;padding:65px 25px;text-align:center;border:1px solid #d6b27e;outline:1px solid #d6b27e;outline-offset:-9px;background:linear-gradient(145deg,#fffdf8ed,#fff2e8ed);box-shadow:0 18px 55px #9b6c4b22;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card:before,.card:after{content:"❀";position:absolute;color:#d99d96;font-size:65px;opacity:.65}.card:before{top:18px;left:22px}.card:after{bottom:18px;right:22px}
.orn{font-size:30px;color:#c49a60;letter-spacing:8px}.eyebrow{margin:28px 0 20px;letter-spacing:5px;text-transform:uppercase;font-size:15px;color:#a77855}
.names{font-family:'Great Vibes',cursive;font-size:clamp(54px,12vw,78px);line-height:1.15;font-weight:400;margin:0;color:#81452f}.amp{font-size:32px;color:#c49a60;margin:5px 0}
.rule{width:105px;height:1px;background:#c49a60;margin:30px auto}.message{font-size:23px;line-height:1.45;margin:0 auto 38px;max-width:370px}
.open{display:inline-block;padding:15px 34px;border-radius:40px;text-decoration:none;background:linear-gradient(135deg,#f4cbc3,#e5a9a1);border:1px solid #d99b91;color:#783e30;letter-spacing:2px;font-size:16px;box-shadow:0 6px 18px #b77b6a30}
.signature{font-family:'Great Vibes',cursive;font-size:31px;color:#b17a5c;margin-top:45px}
</style></head><body><main class="card">
<div class="orn">✧ ❀ ✧</div><div class="eyebrow">Together with our families</div>
<h1 class="names">Abdulrahman</h1><div class="amp">&amp;</div><h1 class="names">Nadine</h1>
<div class="rule"></div><p class="message">We joyfully invite you to celebrate<br>the beginning of our forever.</p>
<a class="open" href="invitation.html">OPEN INVITATION ♡</a><div class="signature">With Love ♡</div>
</main></body></html>
